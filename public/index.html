<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼的家</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐳</text></svg>">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  :root {
    --panel: rgba(16, 22, 44, 0.62);
    --panel-strong: rgba(16, 22, 44, 0.82);
    --line: rgba(160, 190, 255, 0.18);
    --text: #e8eeff;
    --dim: #9fb0d8;
    --accent: #6fb6ff;
    --warm: #ffc98a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; font-size: 13px; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  .glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%); border-radius: 14px; }

  #topbar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  #topbar > * { pointer-events: auto; }
  .brand { font-weight: 600; font-size: 14px; letter-spacing: 0.04em; padding: 7px 14px; }
  .chip { padding: 7px 12px; color: var(--dim); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .chip b { color: var(--text); font-weight: 500; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7592; display: inline-block; }
  .dot.ok { background: #5fe0a0; box-shadow: 0 0 8px #5fe0a0; }
  .dot.bad { background: #ff8a7a; }
  #chip-doing { max-width: min(46vw, 420px); overflow: hidden; text-overflow: ellipsis; }

  #chat { position: fixed; right: 12px; top: 58px; bottom: 76px; width: min(300px, 38vw); display: flex; flex-direction: column; overflow: hidden; transition: transform .25s ease, opacity .25s ease; }
  #chat.closed { transform: translateX(calc(100% + 20px)); opacity: 0; pointer-events: none; }
  #chat header { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-weight: 600; }
  #chat header small { font-weight: 400; color: var(--dim); }
  #chat-clear { font-size: 11.5px; padding: 3px 8px; color: var(--dim); border-radius: 8px; }
  #chat-clear:hover { color: var(--text); }
  #chat-log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: rgba(160,190,255,.3) transparent; }
  .msg { max-width: 86%; padding: 7px 10px; border-radius: 12px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
  .msg.in { align-self: flex-end; background: rgba(111, 182, 255, 0.24); border-bottom-right-radius: 4px; }
  .msg.out { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border-bottom-left-radius: 4px; }
  .msg.old { opacity: 0.55; }
  .msg small { display: block; color: var(--dim); font-size: 10.5px; margin-bottom: 2px; }
  .empty { color: var(--dim); text-align: center; margin: auto; line-height: 1.7; padding: 0 10px; }
  #test { border-top: 1px solid var(--line); padding: 8px 10px 10px; }
  #test summary { cursor: pointer; color: var(--dim); font-size: 12px; user-select: none; }
  #test p { margin: 6px 0; color: var(--dim); font-size: 11.5px; line-height: 1.5; }
  #test input { width: 100%; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--text); font: inherit; outline: none; }
  #test input:focus { border-color: var(--accent); }
  #test .row { display: flex; gap: 6px; margin-top: 6px; }
  #chat-toggle { position: fixed; right: 12px; top: 12px; padding: 7px 12px; cursor: pointer; color: var(--text); font: inherit; }

  #dock { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; justify-content: center; pointer-events: none; }
  .group { display: flex; gap: 4px; padding: 5px; align-items: center; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
  .group > span { color: var(--dim); padding: 0 6px 0 8px; font-size: 12px; }
  button.b { font: inherit; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 6px 10px; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
  button.b:hover { background: rgba(255,255,255,.1); }
  button.b.on { background: rgba(111,182,255,.22); border-color: rgba(111,182,255,.5); }
  button.b.warm.on { background: rgba(255,201,138,.22); border-color: rgba(255,201,138,.55); color: var(--warm); }
  button.b:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .bubble { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); max-width: min(300px, 60vw); padding: 9px 13px; border-radius: 16px; background: rgba(255,255,255,.96); color: #1b2550; line-height: 1.5; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,20,.35); opacity: 0; transition: opacity .2s; white-space: pre-wrap; word-break: break-word; will-change: transform; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
  .bubble.show { opacity: 1; }
  .bubble.emote { padding: 4px 9px; font-size: 22px; border-radius: 50%; min-width: 40px; text-align: center; }
  .bubble.phone { background: rgba(111,182,255,.95); color: #06163a; font-size: 12.5px; max-width: 240px; border-radius: 12px; padding: 7px 10px; }
  .bubble.phone small { display: block; font-size: 10.5px; opacity: .7; }
  .bubble.think { background: rgba(230,236,255,.92); color: #5a6890; letter-spacing: .25em; padding: 6px 12px; }
  /* 心里话：云朵一样的气泡，尾巴是两个小圆点 */
  .bubble.muse { background: rgba(236,241,255,.95); color: #4a5685; border-radius: 22px; font-style: italic; padding: 9px 15px; box-shadow: 0 0 0 2px rgba(150,170,230,.35); }
  .bubble.muse::after { left: 42%; bottom: -13px; width: 9px; height: 9px; border-radius: 50%; transform: none; box-shadow: -9px 10px 0 -2px rgba(236,241,255,.95); }
  #chip-music[hidden] { display: none; }
  #chip-music { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s ease-out; z-index: 40; }
  #flash.on { opacity: .85; transition: none; }
  #snap { position: fixed; right: 18px; bottom: 150px; width: 168px; padding: 8px 8px 6px; border-radius: 10px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.35); transform: rotate(3deg) translateY(30px); opacity: 0; pointer-events: none; transition: all .35s ease; z-index: 30; }
  #snap.show { opacity: 1; transform: rotate(3deg); pointer-events: auto; cursor: pointer; }
  #snap img { display: block; width: 100%; border-radius: 4px; }
  #snap small { display: block; margin-top: 5px; color: #45507a; font-size: 11.5px; line-height: 1.35; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #05070f; color: var(--dim); z-index: 10; transition: opacity .6s; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); padding: 6px 12px; color: var(--dim); font-size: 12px; pointer-events: none; transition: opacity 1s; }
  @media (max-width: 720px) { #chat { width: 76vw; } .group > span { display: none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="bubbles"></div>

<div id="topbar">
  <div class="brand glass">🐳 <span id="name">大肥鱼</span>的家</div>
  <div class="chip glass" id="chip-time">--:--</div>
  <div class="chip glass" id="chip-weather">—</div>
  <div class="chip glass" id="chip-qq"><i class="dot"></i><span>QQ 未连接</span></div>
  <div class="chip glass" id="chip-doing">正在醒来…</div>
  <div class="chip glass" id="chip-music" hidden></div>
</div>
<button id="chat-toggle" class="glass">聊天记录</button>

<aside id="chat" class="glass">
  <header><span>QQ 聊天 <small>· 与房间同步</small></span><button class="b" id="chat-clear" title="只清空当前显示列表，不影响 QQ 历史记录">清空</button></header>
  <div id="chat-log"><div class="empty">这里会同步你和她在 QQ 上的对话。<br>你在 QQ 里发消息，她会掏出手机看；<br>她回了什么，会从她头顶冒出来。</div></div>
  <details id="test">
    <summary>测试（不经过 QQ）</summary>
    <p>没连上 QQ 时，可以在这里假装发消息，看她的身体会怎么反应。这些话不会真的发出去，也不会有真的回复。</p>
    <input id="test-text" placeholder="输入一句话…" maxlength="200">
    <div class="row">
      <button class="b on" id="test-in">假装我发给她</button>
      <button class="b on" id="test-out">假装她回复</button>
      <button class="b" id="test-poke">戳一戳</button>
    </div>
  </details>
</aside>

<div id="hint" class="glass">拖动旋转 · 滚轮往鼠标指的地方缩放 · 右键拖动（或按住 Shift 拖动）平移 · 点地板让她走过去 · 点家具让她去用 · 点她摸摸头</div>

<div id="dock">
  <div class="group glass" id="g-act">
    <span>让她</span>
    <button class="b on" data-act="auto">自由活动</button>
    <button class="b" data-act="window">看窗外</button>
    <button class="b" data-act="lie" data-target="bed">躺床上</button>
    <button class="b" data-act="computer">玩电脑</button>
    <button class="b" data-act="read">看书</button>
    <button class="b" data-act="dance">跳舞</button>
    <button class="b" data-act="spear">练枪</button>
    <button class="b" data-act="box">打拳</button>
    <button class="b" data-act="play">玩球</button>
    <button class="b" data-act="water">浇花</button>
    <button class="b" data-act="eat">吃饭</button>
    <button class="b" data-act="music">放歌</button>
    <button class="b" data-act="photo">拍照</button>
    <button class="b" data-act="sleep">睡觉</button>
  </div>
  <div class="group glass" id="g-time">
    <span>时间</span>
    <button class="b on" data-time="auto">跟随现实</button>
    <button class="b" data-time="day">白天</button>
    <button class="b" data-time="dusk">黄昏</button>
    <button class="b" data-time="night">夜晚</button>
  </div>
  <div class="group glass" id="g-weather">
    <span>天气</span>
    <button class="b on" data-weather="auto">自动</button>
    <button class="b" data-weather="clear">晴</button>
    <button class="b" data-weather="rain">雨</button>
    <button class="b" data-weather="snow">雪</button>
  </div>
  <div class="group glass">
    <button class="b warm" id="btn-lamp">台灯</button>
    <button class="b" id="btn-sound" title="房间里的声音：雨声、脚步、键盘、踢球……">声音</button>
    <button class="b" id="btn-follow">镜头跟随</button>
    <button class="b" id="btn-reset" title="滚轮：往鼠标指的地方缩放；右键拖动或按住 Shift 拖动：平移；点这里回到默认视角">镜头复位</button>
  </div>
</div>

<div id="flash"></div>
<div id="snap" title="点一下收起"><img alt="她刚拍的照片"><small></small></div>
<div id="loading">正在收拾房间…</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
